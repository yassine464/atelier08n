<div class="container mt-4">
  <div class="row justify-content-md-center">
    <div class="col-md-6">
      <h4 class="mb-3">Ajouter un accessoire</h4>
      <form (ngSubmit)="addAccessoire()">
        <div class="mb-3">
          <label class="form-label">Nom</label>
          <input type="text" class="form-control" name="nom" [(ngModel)]="newAccessoire.nomAccessoire" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Prix</label>
          <input type="number" class="form-control" name="prix" [(ngModel)]="newAccessoire.prixAccessoire" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Date de création</label>
          <input type="date" class="form-control" name="date" [(ngModel)]="newAccessoire.dateCreation" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Marque</label>
          <select class="form-select" name="marque" [(ngModel)]="newIdMarque" required>
            @for (m of marques; track m.idMarque) {
              <option [value]="m.idMarque">{{ m.nomMarque }}</option>
            }
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Ajouter</button>
      </form>
    </div>
  </div>
</div>
